<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f6f6;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #4a148c;
        }

        img {
            width: 150px;
            margin: 10px 0;
        }

        input {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background-color: #4a148c;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6a1b9a;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 5px;
            background-color: #e1bee7;
            margin: 3px auto;
            width: 250px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Amigo Secreto</h1>
    <img src="image (1).png" alt="Amigo Secreto">

    <h2>Digite o nome dos amigos</h2>
    <input type="text" id="amigo" placeholder="Digite um nome">
    <button id="btnAdicionar">Adicionar</button>

    <ul id="listaAmigos"></ul>
    
    <button id="btnSortear">🎁 Sortear amigo</button>
    <ul id="lista2">

    </ul>
    <script src="gays.js"></SCript>
</body>
</html>
